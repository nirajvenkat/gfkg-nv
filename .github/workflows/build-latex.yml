name: Build LaTeX and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install minimal TeX Live
      uses: zauguin/install-texlive@v3
      with:
        packages: >-
          latexmk
          marginnote
          sidenotes
          fancyhdr
          geometry
          xcolor
          tcolorbox
          fontenc
          lmodern
          mathrsfs
          enumitem
          mathtools
          amsthm
          amssymb
          amsfonts
          thmtools
          amsmath
          cancel
          dsfont
          bm
          array
          tabularx
          booktabs
          nicematrix
          graphicx
          wrapfig
          float
          caption
          setspace
          multicol
          tikz
          tikz-cd
          tikzsymbols
          physics
          lipsum

    - name: Compile LaTeX to PDF
      run: |
        latexmk -pdf -interaction=nonstopmode gfkg_notes.tex

    - name: Upload compiled PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: gfkg-notes-pdf
        path: gfkg_notes.pdf

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: gfkg_notes.pdf
