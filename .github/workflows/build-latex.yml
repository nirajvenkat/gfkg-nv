name: Build LaTeX and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore TeX Live cache
      id: texlive-cache
      uses: actions/cache@v4
      with:
        path: /usr/local/texlive
        key: ${{ runner.os }}-texlive-${{ hashFiles('**/*.tex') }}
        restore-keys: |
          ${{ runner.os }}-texlive-

    - name: Install TeX Live + tlmgr
      uses: zauguin/install-texlive@v3
      with:
        packages: latexmk  # minimal placeholder to make it run
        # No other packages specified — will install automatically
        update: true

    - name: Auto-install missing LaTeX packages
      run: |
        tlmgr option -- autobackup 0
        tlmgr install latexmk
        latexmk -pdf -interaction=nonstopmode gfkg_notes.tex || true
        missing=$(grep "! LaTeX Error: File" gfkg_notes.log | sed -n "s/.*`\([^']*\)\.sty'.*/\1/p")
        echo "Missing packages: $missing"
        for pkg in $missing; do tlmgr install $pkg || true; done
        latexmk -pdf -interaction=nonstopmode gfkg_notes.tex

    - name: Upload compiled PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: gfkg-notes-pdf
        path: gfkg_notes.pdf

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: gfkg_notes.pdf
